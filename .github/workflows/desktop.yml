name: Desktop apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, mac, win]
        default: all
      release_tag:
        description: Release candidate tag matching package versions
        type: string
        default: v0.3.0-rc.1
        required: true
      expected_main_sha:
        description: Full publication commit approved for this single run
        type: string
        required: true
      draft_release:
        description: Prepare a draft prerelease after both platforms pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform == 'mac' && 'macOS arm64' || 'Windows x64' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'mac' && '["mac"]' || inputs.platform == 'win' && '["win"]' || '["mac","win"]') }}
    runs-on: ${{ matrix.platform == 'mac' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CMAKE_POLICY_VERSION_MINIMUM: '3.10'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI_RUNNER: ${{ matrix.platform == 'mac' && 'macos-15' || 'windows-2025' }}
      PYTHONUTF8: '1'
      TARGET_ARCH: ${{ matrix.platform == 'mac' && 'arm64' || 'x64' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
        run: python desktop/scripts/release-inputs.py --tag "$RELEASE_TAG" --expected-main "$EXPECTED_MAIN"
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/qualification/requirements.txt
      - name: Install qualification tools
        run: python -m pip install -r scripts/qualification/requirements.txt
      - name: Read engine source identity
        run: |
          python -c "import json; print('git_commit_hash=' + json.load(open('scripts/engine-source.json'))['engine_source_sha'])" >> "$GITHUB_ENV"
      - name: Restore compiled engine
        id: native_tool
        uses: actions/cache/restore@v6
        with:
          path: |
            build-native/src/cli/Release/nonplanar_slice_tool
            build-native/src/cli/Release/nonplanar_slice_tool.exe
          key: tool-v1-${{ env.CI_RUNNER }}-${{ env.TARGET_ARCH }}-${{ env.git_commit_hash }}-${{ hashFiles('src/**', 'deps/**', 'scripts/cmake/**', 'CMakeLists.txt') }}
      - name: Install Mac build tools
        if: runner.os == 'macOS' && steps.native_tool.outputs.cache-hit != 'true'
        run: brew install automake texinfo libtool pkgconf nasm ninja xz ccache
      - name: Restore engine compiler cache
        if: runner.os == 'macOS' && steps.native_tool.outputs.cache-hit != 'true'
        id: compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: engine-v1-${{ env.CI_RUNNER }}-${{ env.TARGET_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: engine-v1-${{ env.CI_RUNNER }}-${{ env.TARGET_ARCH }}-
      - name: Configure engine compiler cache
        if: runner.os == 'macOS' && steps.native_tool.outputs.cache-hit != 'true'
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache --max-size=1G
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo 'CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime' >> "$GITHUB_ENV"
          echo 'CCACHE_DEPEND=1' >> "$GITHUB_ENV"
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Windows build tools
        if: runner.os == 'Windows' && steps.native_tool.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm ninja --no-progress -y
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
      - name: Restore native dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: native-v1-${{ env.CI_RUNNER }}-${{ env.TARGET_ARCH }}-${{ hashFiles('deps/**', 'scripts/cmake/modules/ClangClShowIncludes.cmake') }}
          restore-keys: ${{ matrix.platform == 'mac' && 'native-v1-macos-15-arm64-e5a45b4dbd60a01a395fdf8a24680d2dbf360a092d696094e5165f985428ed67' || 'native-v1-windows-2025-x64-98ff655efdb84bfdcf676b53a6b352df63a897a9f0a81b37475747c7031ac397' }}
      - name: Configure dependencies (Mac)
        if: runner.os == 'macOS' && steps.deps.outputs.cache-matched-key == ''
        run: >-
          cmake -S deps -B deps/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          '-DCMAKE_IGNORE_PREFIX_PATH=/opt/local;/usr/local;/opt/homebrew' -DSLIC3R_CAD=OFF -DSLIC3R_GUI=OFF
      - name: Configure dependencies (Windows)
        if: runner.os == 'Windows' && steps.deps.outputs.cache-matched-key == ''
        run: >-
          cmake -S deps -B deps/build -G 'Visual Studio 18 2026' -A x64
          -DDEPS_ARCH=x64 -DCMAKE_BUILD_TYPE=Release -DSLIC3R_CAD=OFF -DSLIC3R_GUI=OFF
      - name: Build native dependencies
        if: steps.deps.outputs.cache-matched-key == ''
        run: cmake --build deps/build --config Release --target deps --parallel 1
      - name: Cache native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure native engine (Mac)
        if: runner.os == 'macOS' && steps.native_tool.outputs.cache-hit != 'true'
        run: >-
          cmake -S . -B build-native -G 'Ninja Multi-Config'
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          '-DCMAKE_IGNORE_PREFIX_PATH=/opt/local;/usr/local;/opt/homebrew'
          -DLIBLZMA_INCLUDE_DIR="$(brew --prefix xz)/include"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DDEP_BUILD_DIR="$GITHUB_WORKSPACE/deps/build"
          -DSLIC3R_GUI=OFF -DSLIC3R_CAD=OFF

      - name: Configure native engine (Windows)
        if: runner.os == 'Windows' && steps.native_tool.outputs.cache-hit != 'true'
        run: >-
          cmake -S . -B build-native -G 'Visual Studio 18 2026' -A x64
          -DCMAKE_BUILD_TYPE=Release -DDEP_BUILD_DIR="$GITHUB_WORKSPACE/deps/build"
          -DSLIC3R_GUI=OFF -DSLIC3R_CAD=OFF

      - name: Build Release engine
        if: steps.native_tool.outputs.cache-hit != 'true'
        run: cmake --build build-native --config Release --target nonplanar_slice_tool --parallel 3
      - name: Cache compiled engine
        if: steps.native_tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build-native/src/cli/Release/nonplanar_slice_tool
            build-native/src/cli/Release/nonplanar_slice_tool.exe
          key: ${{ steps.native_tool.outputs.cache-primary-key }}
      - name: Fetch same-source Linux qualification reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python desktop/scripts/fetch-reference.py --output desktop/build/reference
      - name: Build web UI and install shell dependencies
        run: |
          npm ci --prefix web
          npm run build --prefix web
          npm ci --prefix desktop
      - name: Stage bundled payload
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          python desktop/scripts/stage-ci.py --os '${{ matrix.platform }}' --arch '${{ env.TARGET_ARCH }}' \
            --tool "build-native/src/cli/Release/nonplanar_slice_tool${suffix}" --reference desktop/build/reference
      - name: Package installers
        run: npm run dist:${{ matrix.platform }} --prefix desktop
      - name: Verify final package qualification hashes
        run: |
          archive=$(find desktop/dist -maxdepth 1 -name '*.zip' -print -quit)
          python desktop/scripts/verify-packaged.py --archive "$archive" --evidence "desktop/build/PancakeSlicer-${{ matrix.platform }}-${{ env.TARGET_ARCH }}-qualification.zip"
      - name: Install and smoke-check Windows app
        if: runner.os == 'Windows'
        run: |
          installer=$(find desktop/dist -maxdepth 1 -name '*.exe' -print -quit)
          python desktop/scripts/smoke-installed.py --installer "$installer" --revision "$GITHUB_SHA" --engine-source "$git_commit_hash"
      - name: Install and slice Mac app
        if: runner.os == 'macOS'
        run: |
          installer=$(find desktop/dist -maxdepth 1 -name '*.dmg' -print -quit)
          python desktop/scripts/smoke-mac-installed.py --installer "$installer" --qualification desktop/build/qualification-mac-arm64
      - name: Measure distribution sizes
        run: python desktop/scripts/artifact-sizes.py --platform '${{ matrix.platform }}' --arch '${{ env.TARGET_ARCH }}'
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: PancakeSlicer-${{ matrix.platform }}-${{ env.TARGET_ARCH }}-${{ matrix.platform == 'mac' && 'dmg' || 'exe' }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/*.${{ matrix.platform == 'mac' && 'dmg' || 'exe' }}
      - name: Upload ZIP distribution
        uses: actions/upload-artifact@v7
        with:
          name: PancakeSlicer-${{ matrix.platform }}-${{ env.TARGET_ARCH }}-zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: desktop/dist/*.zip
      - name: Upload qualification and size evidence
        uses: actions/upload-artifact@v7
        with:
          name: PancakeSlicer-${{ matrix.platform }}-${{ env.TARGET_ARCH }}-qualification
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/build/PancakeSlicer-*-qualification.zip
            desktop/build/artifact-sizes-*.json
            desktop/build/installer-smoke/
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'mac'
        with:
          name: PancakeSlicer-source
          compression-level: 0
          path: desktop/build/source.tar.gz
          if-no-files-found: error
      - name: Save engine compiler cache
        if: always() && runner.os == 'macOS' && steps.compiler_cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.platform }}-${{ env.TARGET_ARCH }}
          retention-days: 7
          path: |
            deps/build/**/*.log
            build-native/**/*.log
            desktop/dist/builder-debug.yml
            desktop/build/qualification-*/
            desktop/build/installer-smoke/

  release:
    name: Draft tagged release
    needs: build
    if: inputs.draft_release && inputs.platform == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python desktop/scripts/create-draft-release.py --tag "$RELEASE_TAG" --main "$GITHUB_SHA" --artifacts installers
